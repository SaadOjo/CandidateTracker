services:
  postgres:
    image: postgres:16-alpine
    container_name: candidate-tracker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: candidate_tracker
      POSTGRES_USER: candidate_tracker
      POSTGRES_PASSWORD: candidate_tracker_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
